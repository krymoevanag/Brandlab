        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignAssignment'
          description: ''
  /api/v1/expenses/:
    get:
      operationId: v1_expenses_list
      description: |-
        Elevated Expense Tracker:
        - Capture operational, production, transport, staff, and equipment costs
        - Independent approval policy (no self-approval)
        - Distinct tracking of incurred vs. paid dates
        - Executive dashboard summary metrics
      parameters:
      - in: query
        name: branch
        schema:
          type: integer
      - in: query
        name: category
        schema:
          type: string
          enum:
          - equipment
          - operating
          - other
          - production
          - staff
          - transport
        description: |-
          * `operating` - Operating (Rent, Electricity, Water, Internet, Security)
          * `production` - Production (Consumables, Ink, Vinyl, Blades, Outsourced)
