  /api/v1/design-assignments/:
    get:
      operationId: v1_design_assignments_list
      description: |-
        Design & Artwork Lifecycle:
        - Versioned artwork uploads
        - Revision requests and commenting
        - Authorized approval gate
      parameters:
      - in: query
        name: designer
        schema:
          type: integer
      - in: query
        name: job
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - assigned
          - in_progress
          - rejected
          - review_pending
          - revision_requested
        description: |-
          * `assigned` - Assigned
          * `in_progress` - In Progress
          * `review_pending` - Pending Review
          * `revision_requested` - Revision Requested
          * `approved` - Approved
          * `rejected` - Rejected
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDesignAssignmentList'
          description: ''
    post:
      operationId: v1_design_assignments_create
