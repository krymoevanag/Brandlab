      - REJECT
      - VOID
      - REVERSE
      - EXPORT
      - LOGIN
      - PAYMENT
      - CONVERT
      type: string
      description: |-
        * `CREATE` - Create
        * `UPDATE` - Update
        * `DELETE` - Delete
        * `APPROVE` - Approve
        * `REJECT` - Reject
        * `VOID` - Void / Cancel
        * `REVERSE` - Reverse
        * `EXPORT` - Export
        * `LOGIN` - Login
        * `PAYMENT` - Payment
        * `CONVERT` - Convert Quotation to Job
