openapi: 3.0.3
info:
  title: A to Z Business & Production Management System API
  version: 2.0.0
  description: Centralized REST API serving A to Z Graphics and A to Z CNC Services
    across Nairobi and Meru branches.
paths:
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
          description: ''
  /api/v1/audit-logs/:
    get:
      operationId: v1_audit_logs_list
      description: |-
        Read-only viewset for immutable audit logs.
        Restricted to Owners, Superadmins, and Branch Managers (scoped to assigned branch).
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - APPROVE
          - CONVERT
          - CREATE
          - DELETE
          - EXPORT
          - LOGIN
          - PAYMENT
          - REJECT
          - REVERSE
          - UPDATE
          - VOID
        description: |-
          * `CREATE` - Create
          * `UPDATE` - Update
          * `DELETE` - Delete
          * `APPROVE` - Approve
          * `REJECT` - Reject
          * `VOID` - Void / Cancel
          * `REVERSE` - Reverse
          * `EXPORT` - Export
          * `LOGIN` - Login
          * `PAYMENT` - Payment
          * `CONVERT` - Convert Quotation to Job
      - in: query
        name: branch
        schema:
          type: integer
      - in: query
        name: entity
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit-logs/{id}/:
    get:
      operationId: v1_audit_logs_retrieve
      description: |-
        Read-only viewset for immutable audit logs.
        Restricted to Owners, Superadmins, and Branch Managers (scoped to assigned branch).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Audit Log.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenObtainPair'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: Returns profile information of the currently authenticated user.
      tags:
      - v1
      security:
