      operationId: v1_design_assignments_upload_file_create
      description: |-
        Uploads a new version of artwork for this assignment.
        Auto-increments version and calculates SHA-256.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this design assignment.
        required: true
