          readOnly: true
        entity:
          type: string
          readOnly: true
        entity_id:
          type: string
          readOnly: true
        before:
          readOnly: true
        after:
          readOnly: true
        reason:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
